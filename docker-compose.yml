# BookStack + MariaDB for local AgentDoc Bridge development.
# Based on: https://codeberg.org/bookstack/devops/src/branch/main/config/lsio-docker/docker-compose.yml
#
# Started automatically by `pnpm run dev` (or: `pnpm bookstack:up`).
# UI: http://localhost:6875
# Default login: admin@admin.com / password
#
# Optional: copy .env.example → .env to override defaults.

services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    depends_on:
      - mariadb
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - APP_URL=${BOOKSTACK_APP_URL:-http://localhost:6875}
      # Local-only default. Override via .env / regenerate with:
      # docker run -it --rm --entrypoint /bin/bash lscr.io/linuxserver/bookstack:latest appkey
      - APP_KEY=${BOOKSTACK_APP_KEY:-base64:3qjlIoUX4Tw6fUQgZcxMbz6lb8+dAzqpvItqHvahW1c=}
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${BOOKSTACK_DB_DATABASE:-bookstack}
      - DB_USERNAME=${BOOKSTACK_DB_USERNAME:-bookstack}
      - DB_PASSWORD=${BOOKSTACK_DB_PASSWORD:-bookstack}
    volumes:
      - ./bookstack_app_data:/config
    ports:
      - ${BOOKSTACK_PORT:-6875}:80
    restart: unless-stopped

  mariadb:
    image: lscr.io/linuxserver/mariadb:11.4.9
    container_name: bookstack_mariadb
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - MYSQL_ROOT_PASSWORD=${BOOKSTACK_DB_ROOT_PASSWORD:-mysupersecretrootpassword}
      - MYSQL_DATABASE=${BOOKSTACK_DB_DATABASE:-bookstack}
      - MYSQL_USER=${BOOKSTACK_DB_USERNAME:-bookstack}
      - MYSQL_PASSWORD=${BOOKSTACK_DB_PASSWORD:-bookstack}
    volumes:
      - ./bookstack_db_data:/config
    restart: unless-stopped
